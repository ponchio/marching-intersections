<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marching Intersection Sculptor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .btn {
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #3a3a3c;
      border-color: #666;
    }
    .btn-primary {
      background: #0066cc;
      border-color: #007aff;
    }
    .btn-primary:hover {
      background: #0051a8;
    }
    .separator {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
    }
    label {
      font-size: 13px;
      color: #ccc;
    }
    input[type="file"] {
      display: none;
    }
    /* Step factor control styles */
    .step-wrapper {
      display: inline-block;
      margin-left: 12px;
    }
    .step-wrapper label {
      color: #ddd;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-wrapper input[type="number"] {
      width: 60px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Fullscreen WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Sculpting & File Toolbar -->
  <div id="ui-toolbar">
    <label for="file-input" class="btn btn-primary">Open Mesh (.obj)</label>
    <input type="file" id="file-input" accept=".obj" />

    <div class="separator"></div>

    <button id="btn-filter-grow" class="btn">Filter: Grow</button>
    <button id="btn-filter-dig" class="btn">Filter: Dig</button>
    <button id="btn-filter-flatten" class="btn">Filter: Flatten</button>
    
    <!-- Step factor control (moved from main.js) -->
    <div class="step-wrapper">
      <label for="step-factor">Step factor:
        <input type="number" id="step-factor" value="0.5" step="0.05" min="0.01" max="2" />
      </label>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
